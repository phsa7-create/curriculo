<!DOCTYPE html>
<html>
<head>
    <title>Cadastro de Usuário</title>
</head>
<body>

    <form action="https://httpbin.org/post" method="POST">

        <label for="nome">Nome completo:</label><br>
        <input type="text" id="nome" name="nome" required minlength="3"><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" name="senha" required minlength="8"><br><br>

        <label for="nascimento">Data de nascimento:</label><br>
        <input type="date" id="nascimento" name="nascimento" required><br><br>

        <p>Gênero:</p>
        <input type="radio" id="masc" name="genero" value="masculino">
        <label for="masc">Masculino</label><br>
        
        <input type="radio" id="fem" name="genero" value="feminino">
        <label for="fem">Feminino</label><br>
        
        <input type="radio" id="outro" name="genero" value="outro">
        <label for="outro">Outro</label><br>
        
        <input type="radio" id="prefiro_nao" name="genero" value="prefiro_nao_informar">
        <label for="prefiro_nao">Prefiro não informar</label><br><br>

        <input type="checkbox" id="aceite" name="aceite" value="sim" required>
        <label for="aceite">Aceite dos termos de uso</label><br><br>

        <button type="submit">Criar conta</button>
        <button type="reset">Limpar campos</button>

    </form>

</body>
</html>
