<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazine mundiças</title>
    <link rel="stylesheet" href="at01.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="https://via.placeholder.com/150x50/0086ff/ffffff?text=Magalu" alt="Logotipo Magalu">
        </div>
        <div class="search-bar">
            <input type="search" placeholder="Busque aqui seu produto">
            <button>Buscar</button>
        </div>
    </header>

    <main class="container">
        <h1 class="main-title">Ofertas Especiais</h1>

        <section class="products-grid">
            <article class="product-card">
                <img src="https://via.placeholder.com/300" alt="Produto 1">
                <h2>Smartphone X</h2>
                <p class="price">R$ 1.999,00</p>
                <button>Comprar</button>
            </article>
            <article class="product-card">
                <img src="https://via.placeholder.com/300" alt="Produto 2">
                <h2>Smart TV 55"</h2>
                <p class="price">R$ 2.500,00</p>
                <button>Comprar</button>
            </article>
            <article class="product-card">
                <img src="https://via.placeholder.com/300" alt="Produto 3">
                <h2>Notebook Gamer</h2>
                <p class="price">R$ 4.200,00</p>
                <button>Comprar</button>
            </article>
            <article class="product-card">
                <img src="https://via.placeholder.com/300" alt="Produto 4">
                <h2>Geladeira Frost Free</h2>
                <p class="price">R$ 3.100,00</p>
                <button>Comprar</button>
            </article>
        </section>
    </main>
</body>
</html>
